[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anon-gw"
version = "0.1.0"
description = "Local anonymization gateway for cloud model subscriptions and APIs: pseudonymization vault, secret gate, policy engine, pluggable egress transport."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
anon-gw = "anon_gw.cli:main"

[tool.setuptools.packages.find]
include = ["anon_gw*"]
